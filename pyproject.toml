[project]
name = "sekai-assets-updater"
version = "0.1.0"
description = "Update assets of Project Sekai Colorful Stage"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "aiohttp==3.14.3",
    "anyio==4.9.0",
    "cridecoder>=0.3.5",
    "idna==3.15",
    "olefile==0.47",
    "opendal==0.47.6",
    "orjson==3.11.6",
    "pillow==12.3.0",
    "pjsekai-scores-rs-skia-image==0.5.0",
    "pycryptodome==3.22.0",
    "u-msgpack-python==2.8.0",
    "unity-rs==0.5.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.3.5",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".omo",
    ".tools",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
]

[tool.ruff.lint.per-file-ignores]
"updater/utils/__init__.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyright]
include = [
    "main.py",
    "updater/bundle/audio.py",
    "updater/bundle/integrity.py",
    "updater/bundle/paths.py",
    "updater/bundle/runtime.py",
    "updater/bundle/video.py",
    "updater/constants.py",
    "updater/crypto.py",
    "updater/external_process.py",
    "updater/model.py",
    "updater/security.py",
    "updater/state.py",
    "updater/utils/acb.py",
    "updater/utils/binary.py",
    "updater/utils/chart.py",
    "updater/utils/hca.py",
    "updater/utils/playable.py",
    "updater/utils/usm.py",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."
