[project]
name = "sekai-assets-updater"
version = "0.1.0"
description = "Update assets of Project Sekai Colorful Stage"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "aiohttp==3.14.0",
    "anyio==4.9.0",
    "cridecoder>=0.3.0",
    "idna==3.15",
    "olefile==0.47",
    "orjson==3.11.6",
    "pillow==12.2.0",
    "pjsekai-scores-rs-skia-image",
    "pycryptodome==3.22.0",
    "u-msgpack-python==2.8.0",
    "unitypy==1.22.5",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".omo",
    ".tools",
]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F82",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"
