# The project runtime is pinned in pyproject.toml.
sonar.python.version=3.12

# Only the automated regression suite is test code for SonarCloud purposes.
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Prevent test files from being indexed as production sources. Root-level
# test_*.py files are manual utilities and are intentionally not analyzed.
sonar.exclusions=tests/**,test_*.py
